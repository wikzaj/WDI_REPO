<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria &middot; Galeria rysunku i malarstwa WIT</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="main-nav">
        <a href="./index.html" class="logo">
            <img src="./assets/images/AkademiaWIT-LOGO-square.png" alt="Logo Akademii WIT">
            <span>Galeria rysunku i malarstwa WIT</span>
        </a>
        <ul class="nav-links">
            <li><a href="./galeria.html" class="active">Galeria</a></li>
            <li><a href="./o-przedmiocie.html">O kierunku</a></li>
            <li><a href="./prowadzacy.html">Prowadzący</a></li>
            <li><a href="https://www.wit.edu.pl" target="_blank" rel="noopener">Strona WIT</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1>Prace studentów</h1>
        <p>Kliknij dowolną pracę, aby zobaczyć szczegóły.</p>
        <div class="gallery-filters" id="gallery-filters">
            <button class="filter-btn active" data-filter="all">Wszystkie</button>
            <button class="filter-btn" data-filter="Semestr 1">Semestr 1</button>
            <button class="filter-btn" data-filter="Semestr 2">Semestr 2</button>
            <button class="filter-btn" data-filter="Semestr 3">Semestr 3</button>
            <button class="filter-btn" data-filter="Semestr 4">Semestr 4</button>
            <button class="filter-btn" data-filter="Semestr 5">Semestr 5</button>
        </div>
    </header>

    <section class="gallery-section">
        <div class="gallery-container" id="gallery-container"></div>
        <p class="gallery-empty hidden" id="gallery-empty">Brak prac w wybranym semestrze.</p>
    </section>

    <div id="work-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" aria-label="Zamknij">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer class="site-footer">
        <p>Projekt na zajęcia Lab_03 &middot; Wykonanie: Wiktoria Zając &middot; nr albumu: 22690</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
